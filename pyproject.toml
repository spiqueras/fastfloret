[build-system]
requires = [
    "scikit-build-core>=0.11",
    "nanobind>=2.9",
]
build-backend = "scikit_build_core.build"

[project]
name = "fastfloret"
version = "0.11.0"
description = "fasttext + floret Python bindings"
readme = "python/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "spiqueras", email = "piqueras.santi@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = ["numpy>=1.26.4,<3.0.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/spiqueras/fastfloret"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "python"
build-dir = "build/{wheel_tag}"
# abi3 wheel for CPython >= 3.12; 3.11 and free-threaded builds stay version-specific
wheel.py-api = "cp312"
wheel.packages = ["python/fastfloret_module/fastfloret"]
wheel.exclude = ["**.cc"]
sdist.exclude = [".github", ".idea", ".nox", "uv.lock", "data", "dist", "build"]

[tool.cibuildwheel]
build-frontend = "build[uv]"
skip = ["cp38-*", "cp39-*", "cp310-*"]
test-extras = ["test"]
test-command = "pytest --pyargs fastfloret -Werror"
